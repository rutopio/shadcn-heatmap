<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#09090b"
    />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("theme");
          const isDark = stored ? stored === "dark" : false;
          if (isDark) document.documentElement.classList.add("dark");
        } catch (_e) {
          // ignore
        }
      })();
    </script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BVTE4PJMST"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        // biome-ignore lint/complexity/noArguments: required by Google's official gtag.js snippet
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      // page_view is sent manually on each route resolve (see src/main.tsx).
      gtag("config", "G-BVTE4PJMST", { send_page_view: false });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
